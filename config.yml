# yaml-language-server: $schema=./config.schema.json
# Schema source: src/config/schema.js. Regenerate JSON: node src/config/generateSchemas.js
# Unknown keys and nulls are errors. Use native YAML booleans/numbers, not quoted strings.
# Every option is shown here; these deployment values are not necessarily schema defaults.
logging:
  # fatal | error | warn | info | debug | trace | silent; default: info.
  # Debug packet switches also require level debug or trace.
  level: info
  # Human-readable logs. Default: true; false emits structured JSON. No environment overrides.
  pretty: true

room:
  # ENet UDP bind hostname/IP; default: 0.0.0.0. Independent of public_uri.
  host: 0.0.0.0
  # 1-65535; schema default: 19132. This deployment intentionally uses 19133.
  port: 19133
  # Advertised endpoint: host:port or udp://host:port; bracket IPv6, e.g. [::1]:19132.
  # No credentials, path, query or fragment. Default: 127.0.0.1:19132.
  # Preserve this deployment address; behind NAT set it to an address clients can reach.
  public_uri: 192.168.11.4:19133
  # ENet slots: 1-4095, default 64; joined players are still limited to 8.
  max_peers: 64
  # ENet channel count: 1-255, default 2. This deployment intentionally uses 1.
  channels: 1
  # Ticks per second: 1-1000, default 10 (no sub-millisecond timers).
  tick_rate: 10
  # Accepted client packet bytes: 1-33554432 (32 MiB ENet limit), default 16384.
  max_packet_bytes: 16384
  # Malformed-packet limit before closing a session: 1-1000000, default 8.
  bad_packet_limit: 8
  # Revert a stuck MOVING session to ACTIVE after this many ms.
  # 1-2147483647 (Node timer limit), default 20000.
  move_timeout_ms: 20000
  # full (default): decode complete PlayerState; basic: stateKind, position, velocity.
  # First frame per player is always full to detect the client layout.
  player_state_decode: full

qwd:
  # Empty (default) = standalone: no manager connection or registration.
  # Otherwise ws:// or wss:// URL, without credentials/fragment; paths/queries allowed.
  url: ""

metrics:
  # Optional, separate Prometheus HTTP service. Default false opens no listener.
  enabled: false
  # Default loopback. Expose only on a trusted scraping network.
  host: 127.0.0.1
  # TCP port 1-65535, default 9100. Only GET /metrics is served; other requests get 404.
  port: 9100
