env: development
logging:
  level: info
  pretty: false

room:
  host: 0.0.0.0
  port: 19133
  # Public UDP endpoint reported to qwd. This is intentionally separate from host.
  public_uri: 192.168.11.4:19133
  max_peers: 64
  channels: 2
  tick_rate: 10
  max_packet_bytes: 16384
  bad_packet_limit: 8
  # Revert a session stuck in MOVING back to ACTIVE if the client neither
  # completes the move nor disconnects within this window (ms).
  move_timeout_ms: 20000
  # PlayerState decode depth.
  #   full  - parse every field of the client's state record (default)
  #   basic - stop after stateKind + position + the move block (velocity).
  #           Cross-room migration only needs position and velocity, so this
  #           mode skips the body/queued/outfit records entirely: less CPU and
  #           far less exposure to layout changes between client builds.
  # The first frame per player is always decoded in full to detect which
  # client build it is; later frames use the cheap path.
  player_state_decode: full
  move_targets: []

# Room Authority / Room Manager (QWD) link.
# Leave url empty to run this node standalone as a single 8-player room:
# it will NOT connect to or register with any manager.
# Fill in the QWD WebSocket address (e.g. wss://your-qwd-host) to enable
# manager-coordinated room allocation and cross-room moves.
qwd:
  url: ""
