name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-amd64
          - os: ubuntu-22.04
            target: linux-amd64
    defaults:
      run:
        shell: bash
    env:
      NODE_VERSION: '22.23.5'
      npm_config_build_from_source: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Windows C++ tools
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up Linux C++ tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build native ENet for this platform
        run: node node_modules/node-gyp/bin/node-gyp.js rebuild --directory=node_modules/sky-enet
      - name: Check and test source
        run: |
          npm run check
          npm test
          npm run schema
      - name: Build executable
        run: npm run build:executable
      - name: Package, relocate and test the executable
        run: npm run package:executable
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: xysky-udp-${{ matrix.target }}
          path: |
            dist/xysky-udp-*-${{ matrix.target }}.zip
            dist/xysky-udp-*-${{ matrix.target }}.tar.gz
            dist/xysky-udp-*-${{ matrix.target }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
